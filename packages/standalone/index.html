<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>PFDSL</title></head>
<body>
<header><button type="button" id="sidebar" aria-label="Show sidebar" aria-controls="folder-sidebar" aria-expanded="false" hidden disabled title="Open a folder to use the sidebar">☷ <span aria-hidden="true">Files</span></button><span id="document-state" role="status"></span><span id="document-location" aria-label="Document location" hidden></span></header>
<main><aside id="folder-sidebar" hidden><h2 id="folder-title">Folder files</h2><nav id="files" aria-label="PFD files"></nav></aside><section id="workspace"><nav id="tabs" role="tablist" aria-label="Documents"></nav><section id="start-screen" aria-label="Start"><h1>PFDSL</h1><p>Write a process. See the flow.</p><button type="button" data-start="new">New</button><button type="button" data-start="open-file">Open…</button><button type="button" id="try-sample">Try a sample</button></section><div id="documents"></div><section id="conflicts" aria-label="Disk versions"></section></section></main>
<footer><span id="status" role="status">Open a document or start a new one.</span><p id="save-support" role="status" aria-live="polite"></p></footer>
<script type="module" src="/src/main.ts"></script>
</body>
