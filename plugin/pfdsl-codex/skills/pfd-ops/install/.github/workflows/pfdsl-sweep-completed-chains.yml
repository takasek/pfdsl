name: sweep completed chains

# A push to the default branch is the only event that can change what the
# sweep reads: it reads the default branch's roadmap and nothing else, so a
# chain going fully done is only ever visible there. The sweep only proposes:
# it opens a PR and a human merges it, so the graph is never rewritten outside
# a reviewed change. Deciding what is sweepable reads the default branch
# alone, which cannot see an unmerged branch that still consumes a done
# artifact — that case surfaces as an undeclared id on an edge when the
# branch lands, and the checker rejects it there.
#
# Triggers on every branch push (adopting repos don't all name their default branch
# "main"), then the job itself checks github.ref against
# github.event.repository.default_branch and no-ops otherwise.
# A tag push does not match a branch filter, so it does not trigger at all.
# The push to the sweep's own PR branch is ignored: when the PR is opened with an App token that push starts this workflow, and the run would queue in the concurrency group below and replace a pending run for a default-branch push, losing that sweep.
on:
  push:
    branches-ignore:
      - flow-sync/pending

concurrency:
  group: flow-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep-completed-chains:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The sweep opens PRs, so it acts only in a repository that opted in through the git-managed .pfdsl/config.json.
      # This workflow file ships to adopting repos and gets committed with routine redeploys.
      # The opt-in lives in a file the installer never writes, reviewed in its own PR.
      # Nothing after this step runs unless it reports enabled=true, so a repository that has not opted in spends nothing else.
      # A declaration that cannot be read fails the job instead of silently disabling the sweep.
      # The runner image's own node runs it, ahead of setup-node.
      - name: Read the sweep opt-in from .pfdsl/config.json
        id: sweep-gate
        run: |
          node -e '
            const fs = require("node:fs");
            const file = ".pfdsl/config.json";
            const fail = (why) => {
              console.log("::error::" + file + " " + why);
              process.exit(1);
            };
            const isObject = (v) => typeof v === "object" && v !== null && !Array.isArray(v);
            let text = null;
            try {
              text = fs.readFileSync(file, "utf8");
            } catch (e) {
              if (e.code !== "ENOENT") fail("cannot be read: " + e.message);
            }
            let enabled = false;
            if (text !== null) {
              let config;
              try {
                config = JSON.parse(text);
              } catch (e) {
                fail("is not valid JSON: " + e.message);
              }
              if (!isObject(config)) fail("must contain a JSON object at the top level");
              const sweep = config.sweepCompletedChains;
              if (sweep !== undefined && !isObject(sweep)) fail("has a sweepCompletedChains that is not an object");
              enabled = sweep !== undefined && sweep.enabled === true;
            }
            if (!enabled) {
              console.log("::notice::The completed-chain sweep is disabled. To enable it, commit " + file + " containing {\"sweepCompletedChains\": {\"enabled\": true}}.");
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "enabled=" + enabled + "\n");
          '

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.sweep-gate.outputs.enabled == 'true'
        with:
          node-version: 24

      # This same template file ships to adopting repos (pfd-ops's install/
      # mirror), which have no packages/cli of their own — the check below is
      # what tells this repo's own CI run apart from theirs at runtime, since
      # both run off one committed workflow file.
      - name: Detect this repo's own pfdsl workspace
        id: detect-workspace
        if: steps.sweep-gate.outputs.enabled == 'true'
        run: |
          if [ -f pnpm-workspace.yaml ] && [ -f packages/cli/package.json ]; then
            echo "in_workspace=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_workspace=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.sweep-gate.outputs.enabled == 'true' && steps.detect-workspace.outputs.in_workspace == 'true'

      # In this repo: build packages/cli from the very source this push
      # carries, so the sweep checks with the same code its own tests cover —
      # not a published release that can lag behind, or even predate a
      # subcommand the sweep script depends on (#1125 review).
      - name: Build this repo's own @pfdsl/cli from source
        if: steps.sweep-gate.outputs.enabled == 'true' && steps.detect-workspace.outputs.in_workspace == 'true'
        id: build-cli
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
          version=$(node -p "require('./packages/cli/package.json').version")
          echo "Built this repo's own @pfdsl/cli@$version from source"
          {
            echo "description=this repo's own from-source build of \`@pfdsl/cli@${version}\`, the same build the rest of this repo's CI uses"
          } >> "$GITHUB_OUTPUT"

      # In an adopting repo: no packages/cli to build, so fall back to the
      # last published release, same as before.
      - name: Install the published @pfdsl/cli
        if: steps.sweep-gate.outputs.enabled == 'true' && steps.detect-workspace.outputs.in_workspace != 'true'
        id: install-cli
        run: |
          npm install --no-save @pfdsl/cli
          version=$(node -p "require('./node_modules/@pfdsl/cli/package.json').version")
          echo "Resolved @pfdsl/cli version: $version"
          {
            echo "description=the published \`@pfdsl/cli@${version}\` (\`npm install --no-save\`, unpinned) — a different release than what this repo's own CI builds and tests from source"
          } >> "$GITHUB_OUTPUT"

      - name: Sweep completed chains out of the roadmap
        if: steps.sweep-gate.outputs.enabled == 'true'
        run: node scripts/pfdsl/sweep-completed-chains.mjs .pfdsl/roadmap.pfdsl --write

      # GitHub holds the pull_request runs of a PR opened with GITHUB_TOKEN until someone with write access approves them.
      # A PR opened with a GitHub App installation token runs them straight away, which is what lets this repo's own CI gate the sweep.
      # The repository opts in by setting the PFDSL_SWEEP_APP_CLIENT_ID variable and the PFDSL_SWEEP_APP_PRIVATE_KEY secret.
      # Without them the PR is opened with GITHUB_TOKEN as before, and the run waits for approval.
      # The variable is the switch: a variable set without a usable secret fails this step instead of silently falling back, while a secret set without the variable leaves the PR on GITHUB_TOKEN (the secret cannot be read in a step condition).
      # The PR body says which token opened the PR.
      - name: Create short-lived App token to open the PR
        id: app-token
        if: steps.sweep-gate.outputs.enabled == 'true' && vars.PFDSL_SWEEP_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PFDSL_SWEEP_APP_CLIENT_ID }}
          private-key: ${{ secrets.PFDSL_SWEEP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open PR if roadmap.pfdsl changed
        id: open-pr
        if: steps.sweep-gate.outputs.enabled == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          add-paths: .pfdsl/roadmap.pfdsl
          branch: flow-sync/pending
          commit-message: "chore(plan): sweep completed chains after a push to the default branch"
          title: "chore(plan): sweep completed chains"
          body: |
            Removes chains whose artifacts are all done from `.pfdsl/roadmap.pfdsl`.
            What stays is every process that still outputs an unfinished artifact, and the artifacts on those processes' edges — a done artifact is kept when an open process still reads it as an input, not as a record that it finished. Completed history lives in the closed issues, the git history, the decision records and the published registries.

            The sweep applied nothing until `check` passed, `graph orphans` came back empty, `fmt --check` passed, and `status blocked` produced byte-identical output before and after. `status ready` is compared the same way except for one field: `empty.complete` (the count of completed-chain processes, present only when the ready set is empty) is excluded, because a sweep that found anything to remove always reduces it by design. Comparing everything else whole is the point: an id-set comparison alone would pass a sweep that leaves a process ready while quietly taking one of its inputs away.

            The checks above — `check`, `graph orphans`, `fmt --check`, and the ready/blocked comparison — ran in the sweep job itself, whichever token opened this PR.

            ${{ steps.app-token.outcome == 'success' && 'This PR was opened with a GitHub App token, so the `pull_request` workflows of this repository, if it has any, started on it without waiting for approval. Their results appear in the checks of this PR.' || 'This PR was opened with `GITHUB_TOKEN`, so GitHub holds the `pull_request` workflows of this repository, if it has any, in an approval-required state until someone with write access approves them. Until then the checks above are the only verification this change has received, and a PR with no passing CI checks means those runs are still waiting, not that they passed. To start them without approval, set the `PFDSL_SWEEP_APP_CLIENT_ID` variable and the `PFDSL_SWEEP_APP_PRIVATE_KEY` secret of a GitHub App with contents and pull-requests write access.' }}

            This job used ${{ steps.build-cli.outputs.description || steps.install-cli.outputs.description }} to run the checks above.

            no-issue: mechanical roadmap bookkeeping triggered by a push to the default branch, carrying no work item of its own.

      # The step above can fail after the sweep succeeded and flow-sync/pending was pushed.
      # The usual cause is a repository that does not allow GitHub Actions to create pull requests.
      # A workflow cannot read that setting beforehand (the REST endpoint needs Administration read, which GITHUB_TOKEN cannot be granted), so this step explains the failure afterwards.
      # It adds an annotation and leaves the job failed: the PR step's own failure is what fails the job, so a run that created no PR is never reported as a success.
      # The enabled term is implied by the PR step's outcome and kept so every step after the gate states its opt-in.
      - name: Explain a failed pull request step
        id: pr-failure-notice
        if: steps.sweep-gate.outputs.enabled == 'true' && failure() && steps.open-pr.outcome == 'failure'
        env:
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch=flow-sync/pending
          nl=$'\n'
          msg='The sweep and the push to flow-sync/pending already happened; only the pull request was not created. If the log of the "Open PR if roadmap.pfdsl changed" step shows a push error instead, resolve that first.'
          msg="${msg}${nl}To open the pull request by hand, use: ${SERVER_URL}/${REPOSITORY}/compare/${DEFAULT_BRANCH}...${branch}"
          if [ "$APP_TOKEN_OUTCOME" = success ]; then
            msg="${msg}${nl}"'The pull request was attempted with a GitHub App installation token, which does not depend on the repository setting for GITHUB_TOKEN. Check that the App is installed on this repository with Contents and Pull requests write permissions.'
          else
            msg="${msg}${nl}"'The pull request was attempted with GITHUB_TOKEN. Check that the repository allows GitHub Actions to create pull requests: Settings → Actions → General → Workflow permissions → "Allow GitHub Actions to create and approve pull requests". If the repository belongs to an organization that restricts this, the organization setting must allow it too.'
          fi
          echo "::error::${msg//$'\n'/%0A}"
