name: check pfd-ops install sync

on:
  push:
    paths:
      - '.claude/skills/pfd-ops/install/**'
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.claude/skills/pfd-ops/install/**'
      - '.github/workflows/**'
      - 'scripts/**'

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check pfd-ops/install in sync with deployed locations
        run: |
          fail=0

          # Each file under install/ must match the file at the same relative path from repo root.
          # This identity is still a true invariant, but it's no longer the whole
          # story: install/ is now a generated mirror (#547), so the step below
          # additionally verifies it was actually generated from its repo-root
          # sources, not hand-edited to merely match by coincidence.
          while IFS= read -r src; do
            rel="${src#.claude/skills/pfd-ops/install/}"
            dst="$rel"
            if [ ! -f "$dst" ]; then
              echo "MISSING: $dst (canonical: $src)"
              fail=1
            elif ! diff_out=$(diff "$src" "$dst" 2>&1); then
              echo "OUT OF SYNC: $dst differs from canonical $src"
              echo "$diff_out"
              fail=1
            fi
          done < <(find .claude/skills/pfd-ops/install -type f | sort)

          if [ $fail -ne 0 ]; then
            echo ""
            echo "Fix: .claude/skills/pfd-ops/install/ is generated. Edit the repo-root source and run 'make gen-install'."
            exit 1
          fi
          echo "All pfd-ops install files in sync."
      - name: Check pfd-ops/install was generated from its repo-root sources
        run: |
          node scripts/gen-install.mjs
          if ! node scripts/check-generated-drift.mjs -- .claude/skills/pfd-ops/install; then
            echo ""
            echo "Fix: .claude/skills/pfd-ops/install/ is generated. Edit the repo-root source and run 'make gen-install'."
            exit 1
          fi
          echo "pfd-ops install/ matches 'node scripts/gen-install.mjs' output."
