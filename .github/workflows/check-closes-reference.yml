name: check closes reference

on:
  # This check reads the PR body, which the default trigger set never reports a
  # change to: opened / synchronize / reopened all track the branch. `edited`
  # is the only type that fires on a body edit — the fix this check's own
  # failure text demands (#936). It is a superset of that: a title or base
  # change fires it too, and re-runs the check for nothing. The run costs
  # seconds, and the alternative is a red that stays red after it is fixed.
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check that a PR into the default branch closes an issue
        run: >-
          node scripts/check-closes-reference.mjs
          --pr "$PR_NUMBER"
          --base "$BASE_REF"
          --default-branch "$DEFAULT_BRANCH"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
