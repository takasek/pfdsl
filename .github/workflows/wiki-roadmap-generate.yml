name: Generate Wiki roadmap preview

on:
  gollum:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-roadmap-preview
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Generate and publish the trial pair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git clone "https://github.com/${REPOSITORY}.wiki.git" "$RUNNER_TEMP/roadmap-wiki"
          wiki_revision=$(git -C "$RUNNER_TEMP/roadmap-wiki" rev-parse HEAD)
          export WIKI_REVISION="$wiki_revision"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const repository = process.env.REPOSITORY;
          const root = process.env.GITHUB_WORKSPACE;
          const wiki = join(process.env.RUNNER_TEMP, 'roadmap-wiki');
          const wikiSource = `https://github.com/${repository}.wiki.git`;
          const repositorySource = `https://github.com/${repository}.git`;
          const revision = (cwd) => execFileSync('git', ['-C', cwd, 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const wikiRevision = process.env.WIKI_REVISION;
          const repositoryRevision = revision(root);
          const config = {
            roadmapSource: {
              adapter: 'local-git', source: wikiSource, revision: wikiRevision,
              documentId: 'roadmap.pfdsl', companionId: 'roadmap.md', logicalPath: 'roadmap.pfdsl',
              basis: { source: wikiSource, revision: wikiRevision },
            },
            localSources: { [wikiSource]: wiki, [repositorySource]: root },
          };
          writeFileSync(join(process.env.RUNNER_TEMP, 'roadmap-source.json'), JSON.stringify(config));
          console.log(`Wiki input revision: ${wikiRevision}; implementation revision: ${repositoryRevision}`);
          NODE
          node scripts/wiki-roadmap-generate.mjs --wiki "$RUNNER_TEMP/roadmap-wiki" --repository "$REPOSITORY" --expected-revision "$wiki_revision" --source-config "$RUNNER_TEMP/roadmap-source.json" --publish
