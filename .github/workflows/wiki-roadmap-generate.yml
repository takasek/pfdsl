name: Generate Wiki roadmap preview

on:
  gollum:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-roadmap-preview
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Generate and publish the trial pair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/wiki-roadmap-run.mjs --wiki "$RUNNER_TEMP/roadmap-wiki" --repository "$REPOSITORY" --repository-root "$GITHUB_WORKSPACE" --publish
