name: Publish libraries to npm

on:
  push:
    tags:
      - 'lib-v*'
  workflow_dispatch:

jobs:
  publish-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag ref
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "This workflow only publishes an exact release tag ref." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag and package versions
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-ref.mjs libs

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@pfdsl/core" build

      - run: pnpm --filter "@pfdsl/core" test

      - run: pnpm publish --provenance --access public --no-git-checks
        working-directory: packages/core

  publish-graphviz-exporter:
    runs-on: ubuntu-latest
    needs: publish-core
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag ref
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "This workflow only publishes an exact release tag ref." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag and package versions
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-ref.mjs libs

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@pfdsl/graphviz-exporter..." build

      - run: pnpm --filter "@pfdsl/graphviz-exporter" test

      - run: pnpm publish --provenance --access public --no-git-checks
        working-directory: packages/graphviz-exporter

  publish-preview-engine:
    runs-on: ubuntu-latest
    needs: [publish-core, publish-graphviz-exporter]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag ref
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "This workflow only publishes an exact release tag ref." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag and package versions
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-ref.mjs libs

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@pfdsl/preview-engine..." build

      - run: pnpm --filter "@pfdsl/preview-engine" test

      - run: pnpm publish --provenance --access public --no-git-checks
        working-directory: packages/preview-engine
