name: render pfdsl svg

on:
  push:
    branches: [main]
    paths:
      - '.pfdsl/**/*.pfdsl'
  workflow_dispatch:
    inputs:
      mode:
        description: Publish changed SVGs directly or by pull request
        type: choice
        options: [direct, pr]
        default: direct
      target-branch:
        description: Branch containing the PFD files and receiving changed SVGs
        type: string
        default: main
      paths:
        description: Newline-separated glob patterns for PFD files to regenerate
        type: string
        default: .pfdsl/**/*.pfdsl
      cli-ref:
        description: Git ref of takasek/pfdsl used to build the renderer
        type: string
        default: main
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of a GitHub App installed on the caller repository
        required: true
        type: string
      mode:
        description: Open a pull request or push generated SVGs directly
        required: false
        type: string
        default: direct
      target-branch:
        description: Branch that contains the PFD files and receives generated SVGs
        required: false
        type: string
        default: main
      paths:
        description: Newline-separated glob patterns for PFD files
        required: false
        type: string
        default: .pfdsl/**/*.pfdsl
      cli-ref:
        description: Git ref of takasek/pfdsl used to build the renderer
        required: false
        type: string
        default: main
    secrets:
      app-private-key:
        description: Private key of the GitHub App
        required: true

permissions:
  contents: read

concurrency:
  group: render-pfdsl-svg-${{ github.repository }}-${{ inputs.target-branch || 'main' }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Validate mode
        env:
          MODE: ${{ inputs.mode || 'direct' }}
        run: |
          if [[ "$MODE" != direct && "$MODE" != pr ]]; then
            echo "mode must be 'direct' or 'pr'" >&2
            exit 1
          fi

      - name: Check out diagrams
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target-branch || 'main' }}
          persist-credentials: false

      - name: Check out renderer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: takasek/pfdsl
          ref: ${{ inputs.cli-ref || 'main' }}
          path: .pfdsl-renderer
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .pfdsl-renderer/pnpm-lock.yaml

      - name: Build renderer
        working-directory: .pfdsl-renderer
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: Render sibling SVG files
        id: render
        env:
          FILE_PATTERNS: ${{ inputs.paths || '.pfdsl/**/*.pfdsl' }}
        run: |
          patterns=()
          while IFS= read -r pattern; do
            [[ -z "$pattern" ]] || patterns+=(":(glob)$pattern")
          done <<< "$FILE_PATTERNS"
          if (( ${#patterns[@]} == 0 )); then
            echo 'paths must contain at least one pattern' >&2
            exit 1
          fi
          svg_paths="$RUNNER_TEMP/pfdsl-svg-paths"
          : > "$svg_paths"
          while IFS= read -r -d '' file; do
            [[ "$file" == *.pfdsl ]] || continue
            svg="${file%.pfdsl}.svg"
            if [[ "$svg" == *$'\n'* ]]; then
              echo 'PFD file paths cannot contain newlines' >&2
              exit 1
            fi
            tmp_svg=$(mktemp "$RUNNER_TEMP/pfdsl-svg.XXXXXX")
            node .pfdsl-renderer/packages/cli/dist/cli.js render "$file" --format svg > "$tmp_svg"
            if [[ -e "$svg" ]] && cmp -s -- "$tmp_svg" "$svg"; then
              rm -f -- "$tmp_svg"
              continue
            fi
            mv -- "$tmp_svg" "$svg"
            printf '%s\n' "$svg" >> "$svg_paths"
          done < <(git ls-files -z -- "${patterns[@]}")
          if [[ -s "$svg_paths" ]]; then
            {
              echo 'svg_paths<<PFDSL_SVG_PATHS'
              cat "$svg_paths"
              echo 'PFDSL_SVG_PATHS'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create short-lived App token
        id: app-token
        if: steps.render.outputs.svg_paths != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app-client-id || vars.PFD_GENERATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key || secrets.PFD_GENERATOR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: ${{ (inputs.mode || 'direct') == 'pr' && 'write' || '' }}

      - name: Push updated SVG files
        if: steps.render.outputs.svg_paths != '' && (inputs.mode || 'direct') == 'direct'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SVG_PATHS: ${{ steps.render.outputs.svg_paths }}
          TARGET_BRANCH: ${{ inputs.target-branch || 'main' }}
        run: |
          while IFS= read -r svg; do
            [[ -z "$svg" ]] || git add -- "$svg"
          done <<< "$SVG_PATHS"
          if git diff --cached --quiet; then
            exit 0
          fi
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m 'docs(pfdsl): update generated SVG diagrams'
          gh auth setup-git
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Open or update SVG pull request
        if: steps.render.outputs.svg_paths != '' && inputs.mode == 'pr'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ inputs.target-branch }}
          branch: pfdsl-svg/${{ inputs.target-branch }}
          add-paths: ${{ steps.render.outputs.svg_paths }}
          commit-message: 'docs(pfdsl): update generated SVG diagrams'
          title: 'docs(pfdsl): update generated SVG diagrams'
          body: 'Generated sibling SVG files for the current PFD files.'
