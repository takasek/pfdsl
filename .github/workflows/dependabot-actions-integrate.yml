name: integrate Dependabot Actions updates

# workflow_run can access Actions secrets even when the Dependabot-triggered
# queue workflow cannot. Never download its artifacts or check out its head.
on:
  workflow_run:
    workflows: [queue Dependabot Actions updates]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  integrate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPENDABOT_BATCH_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: dependabot-actions-integrate
      cancel-in-progress: false
    steps:
      - name: Verify the settle job completed
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/attempts/${UPSTREAM_ATTEMPT}/jobs" --jq '.jobs | any(.name == "settle" and .conclusion == "success")')" = true

      # Default branch code only. PR files are checked as data before their Git
      # commits are merged locally into the batch branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: make setup

      - run: make build

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.DEPENDABOT_BATCH_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_BATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Combine, repair, verify, and open the final PR
        run: node scripts/dependabot-actions-batch.mjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
