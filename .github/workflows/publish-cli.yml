name: Publish CLI to npm

on:
  push:
    tags:
      - 'v[0-9]*'
  # Manual fallback: tag pushes occasionally fail to trigger this workflow.
  # Dispatch from the exact release tag only.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag ref
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "This workflow only publishes an exact release tag ref." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag and package version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-ref.mjs cli

      - run: pnpm install --frozen-lockfile

      # .claude/skills/pfdsl is gitignored (#348) and absent on a fresh checkout, so link it to the tracked generated copy the way `make setup` does (#714).
      - run: node scripts/link-repo-skill.mjs

      - run: pnpm --filter "@pfdsl/cli..." build

      - run: pnpm --filter "@pfdsl/cli..." test

      - run: npm publish --provenance --access public
        working-directory: packages/cli
