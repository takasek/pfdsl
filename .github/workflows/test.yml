name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: make lint

      # .claude/skills/pfdsl is gitignored (#348) and absent on a fresh checkout, so link it to the tracked generated copy the way `make setup` does (#714) and checks that read the repo-local skill path resolve.
      - run: node scripts/link-repo-skill.mjs

      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r test

      - run: node --test "scripts/*.test.mjs" "scripts/lib/*.test.mjs" "scripts/pfdsl/lib/*.test.mjs" "hooks/*.test.mjs" "hooks/lib/*.test.mjs" "plugin/pfdsl/hooks/lib/*.test.mjs" "plugin/pfdsl-codex/hooks/lib/*.test.mjs" "packages/vscode-extension/smoke/*.test.mjs"

      - run: node scripts/check-script-imports.mjs

      - run: node scripts/check-no-shell-strings.mjs
      - run: node scripts/check-cli-conventions.mjs

      - run: make check-docs

      - run: make check-fmt

      - run: make check-links

      - run: make check-scaffold

      - run: make check-readme-cli

      - name: Verify snapshots are up-to-date with .pfdsl files
        run: |
          pnpm --filter @pfdsl/core exec vitest run -u
          node scripts/check-generated-drift.mjs -- packages/core/src/__snapshots__/

  vscode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: xvfb-run --auto-servernum make test-vscode-smoke
