name: check commit subjects

# The gate's commit-subject verdict only covers the range that existed when a
# cycle's runner ran it, and nothing re-derives it when commits land afterwards
# (#1174). `synchronize` fires on every push to the branch, so this job judges
# the current range each time.
#
# Use pull_request_target without a paths filter: the check is about the range
# itself, so there is no path whose absence makes it inapplicable, and a push
# to the default branch has no base to form a range against. GitHub can still
# suppress this event for a PR head branch whose name resembles a SHA.
#
# `edited` is in the type list for the same reason check-closes-reference.yml
# carries it: the default types all track the branch, and retargeting a PR to
# a different base changes the range without touching a commit. Without it the
# verdict from the old base stays posted against a range it never judged.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

# The workflow and checker script come from the base branch. The PR's Git
# objects are data only; no PR code runs with pull_request_target's token.
permissions:
  contents: read

jobs:
  check:
    # Keep the reported context distinct from every other job.
    name: check commit subjects
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives the base ref and history. Do not check out PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Fetch the PR ref as Git data, then ensure it still names the event's
      # head. A concurrent push must not give an older event a green result for
      # a newer range.
      - name: Fetch the PR commit range
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # origin/<base_ref> rather than the payload's base.sha: base.sha is the
      # base tip as of the event, so it does not follow the base branch
      # forward, and the range would stop matching the gate's
      # `origin/<base>..HEAD` once the base advances.
      - name: Lint the branch's commit subjects
        run: >-
          node scripts/check-commit-subjects.mjs
          --base "origin/$BASE_REF"
          --head FETCH_HEAD
        env:
          BASE_REF: ${{ github.base_ref }}
