name: issue1424-diagnostics

on:
  push:
    branches: [codex/issue-1408-linux-verification]
    paths:
      - .github/workflows/issue1424-diagnostics.yml
      - scripts/issue1424-diagnostics/**
      - scripts/issue1424*.test.mjs

permissions:
  contents: read

jobs:
  fixed-source-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    env:
      SOURCE_SHA: 526e17c070bb1447ebf3f74192db2fef391b60a8
    steps:
      - name: Initialize evidence paths on the runner
        run: |
          mkdir -p "$RUNNER_TEMP/issue1424-evidence"
          echo "PFDSL_EVIDENCE_DIR=$RUNNER_TEMP/issue1424-evidence" >> "$GITHUB_ENV"
          echo "PFDSL_DIAG_LOG=$RUNNER_TEMP/issue1424-evidence/api.jsonl" >> "$GITHUB_ENV"
          echo "PFDSL_DOM_LOG=$RUNNER_TEMP/issue1424-evidence/dom.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 526e17c070bb1447ebf3f74192db2fef391b60a8
          path: pfdsl
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
          package_json_file: pfdsl/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pfdsl/pnpm-lock.yaml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/pfdsl-vscode-smoke-cache/pfdsl
          key: vscode-smoke-${{ runner.os }}-vscode-1.132.1-test-electron-${{ hashFiles('pfdsl/pnpm-lock.yaml') }}
      - name: Record baseline and runner identities
        working-directory: pfdsl
        run: |
          mkdir -p "$PFDSL_EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo '87b85cc6825831c080cee542a02e4f327ec252103e9f0679148d61f6d0717248  pnpm-lock.yaml' | sha256sum -c -
          {
            git rev-parse HEAD
            git -C ../control rev-parse HEAD
            node --version
            pnpm --version
            cat /etc/os-release
            uname -a
            printf 'ImageOS=%s ImageVersion=%s run=%s attempt=%s trial=%s\n' "$ImageOS" "$ImageVersion" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" '${{ matrix.trial }}'
          } > "$PFDSL_EVIDENCE_DIR/identity.txt"
          sha256sum pnpm-lock.yaml packages/vscode-extension/smoke/run.mjs packages/vscode-extension/smoke/harness.mjs > "$PFDSL_EVIDENCE_DIR/baseline.sha256"
      - name: Apply observation-only instrumentation to the fixed checkout
        run: node control/scripts/issue1424-diagnostics/prepare.mjs "$GITHUB_WORKSPACE/pfdsl"
      - name: Record the actual instrumented sources
        working-directory: pfdsl
        run: |
          git diff --binary > "$PFDSL_EVIDENCE_DIR/instrumentation.patch"
          cp packages/vscode-extension/src/trace.ts "$PFDSL_EVIDENCE_DIR/trace.ts"
          cp packages/vscode-extension/smoke/trace-workbench.mjs "$PFDSL_EVIDENCE_DIR/trace-workbench.mjs"
          sha256sum packages/vscode-extension/src/*.ts packages/vscode-extension/smoke/*.mjs > "$PFDSL_EVIDENCE_DIR/instrumented.sha256"
      - run: pnpm install --frozen-lockfile
        working-directory: pfdsl
      - name: Build the same smoke prerequisites
        working-directory: pfdsl
        run: |
          set -o pipefail
          make vscode-build 2>&1 | tee "$PFDSL_EVIDENCE_DIR/build.log"
          pnpm --filter ./packages/vscode-extension typecheck
          find packages/vscode-extension/dist -type f -print0 | sort -z | xargs -0 sha256sum > "$PFDSL_EVIDENCE_DIR/bundle.sha256"
      - name: Run the original full smoke sequence once
        working-directory: pfdsl
        run: |
          set -o pipefail
          xvfb-run --auto-servernum pnpm --filter ./packages/vscode-extension test:smoke 2>&1 | tee "$PFDSL_EVIDENCE_DIR/smoke.log"
      - name: Preserve result and checksum evidence even after a failed smoke
        if: always()
        working-directory: pfdsl
        run: |
          mkdir -p "$PFDSL_EVIDENCE_DIR"
          printf 'job-status=%s\n' '${{ job.status }}' > "$PFDSL_EVIDENCE_DIR/status.txt"
          sha256sum pnpm-lock.yaml > "$PFDSL_EVIDENCE_DIR/lock-after.sha256"
          echo '87b85cc6825831c080cee542a02e4f327ec252103e9f0679148d61f6d0717248  pnpm-lock.yaml' | sha256sum -c -
          cd "$PFDSL_EVIDENCE_DIR"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: issue1424-526e17c-${{ github.run_id }}-attempt-${{ github.run_attempt }}-trial-${{ matrix.trial }}
          path: ${{ runner.temp }}/issue1424-evidence
          if-no-files-found: error
          retention-days: 14
