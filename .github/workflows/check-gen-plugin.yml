name: check gen-plugin identity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gen-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # .claude/skills/pfdsl is gitignored (#348), so it doesn't exist on a
      # fresh checkout — link it to the tracked bundle copy the way `make
      # setup` does (#714).
      - run: node scripts/link-repo-skill.mjs

      - name: Regenerate plugin dir and assert no drift
        run: |
          make gen-plugin
          if ! git diff --exit-code plugin .claude-plugin/marketplace.json; then
            echo ""
            echo "ERROR: plugin/pfdsl or .claude-plugin/marketplace.json is stale (this also catches a"
            echo "plugin.json version left behind after a CLI release, and a marketplace.json"
            echo "description left behind after a bundled skill/command change)."
            echo "Run 'make gen-plugin' and commit the result."
            exit 1
          fi
          echo "gen-plugin identity in sync."
