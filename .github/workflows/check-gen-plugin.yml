name: check gen-plugin identity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gen-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # .claude/skills/pfdsl is gitignored (#348), so a fresh checkout links it to the tracked generated copy the way `make setup` does (#714).
      - run: node scripts/link-repo-skill.mjs

      # gen-plugin renders SKILL.md from `pfdsl help` and runs check-docs, both
      # of which read packages/cli/dist. This is CI's only check-docs run;
      # test.yml leaves it to this required job. The build used to ride along inside
      # bootstrap-pfdsl-skill; the link replaced that target, so name it here.
      - run: pnpm -r build

      # The diffed paths come from scripts/lib/gen-plugin-outputs.mjs, shared with the pre-commit and terminal gates (#1203).
      - name: Regenerate Claude and Codex assets and assert no drift
        run: |
          make gen-plugin
          if ! node scripts/check-generated-drift.mjs --gen-plugin ci; then
            echo ""
            echo "ERROR: generated Claude or Codex assets are stale."
            echo "Run 'make gen-plugin' and commit the result."
            exit 1
          fi
          echo "Claude and Codex generated assets are in sync."
